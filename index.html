<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171126">
<title>Ritmo</title>
<style>
:root{--bg:#171126;--panel:#211a35;--panel2:#2a2142;--text:#f7f3ff;--muted:#b8accf;--accent:#b99cff;--line:#3c3158}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:22px 18px 12px;max-width:900px;margin:auto}
h1{margin:0;font-size:28px}
header p{color:var(--muted);margin:6px 0}
main{max-width:900px;margin:auto;padding:12px 16px 40px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
input,select,textarea,button{font:inherit;border-radius:12px;padding:12px;border:1px solid var(--line);background:#171126;color:var(--text);width:100%}
input::placeholder{color:#9285aa}
button{background:var(--accent);color:#201633;border:0;font-weight:700;cursor:pointer}
button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button.danger{background:#552b40;color:#ffe6eb}
form{display:grid;gap:10px}
.nav{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}
.nav button{min-width:100px;white-space:nowrap}
.nav button.active{background:#e0d2ff}
.item{padding:13px 0;border-bottom:1px solid var(--line)}
.item strong{display:block;font-size:17px}
.item small{display:block;color:var(--muted);margin:5px 0 10px}
.actions{display:flex;gap:8px}
.actions button{padding:9px;font-size:14px}
.muted{color:var(--muted)}
.hidden{display:none!important}
.error{color:#ffb7c2;white-space:pre-wrap}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.topline button{width:auto}
.empty{color:var(--muted);padding:18px 0;text-align:center}
@media(max-width:560px){header{padding-top:18px}}
</style>
</head>
<body>
<header>
<div class="topline">
<div><h1>Ritmo</h1><p>Tu espacio de organización</p></div>
<button id="logout" class="secondary hidden">Salir</button>
</div>
</header>
<main>
<section id="login" class="panel">
<h2>Iniciar sesión</h2>
<p class="muted">Entra con tu cuenta para acceder a tus datos.</p>
<form id="loginForm">
<input id="email" type="email" autocomplete="username" value="veloboaea@gmail.com" placeholder="Correo electrónico" required>
<input id="password" type="password" autocomplete="current-password" placeholder="Contraseña" required>
<button id="loginButton" type="submit">Entrar</button>
<div id="loginMessage" class="error" role="status"></div>
</form>
</section>
<section id="app" class="hidden">
<div class="nav">
<button class="active" data-tab="clients">Clientes</button>
<button class="secondary" data-tab="agenda">Agenda</button>
<button class="secondary" data-tab="payments">Cobros</button>
</div>
<div class="panel">
<div class="topline">
<h2 id="sectionTitle">Clientes</h2>
<button id="export" class="secondary">Exportar CSV</button>
</div>
<p id="syncStatus" class="muted">Conectando con la nube…</p>
</div>
<div class="panel">
<h3 id="formTitle">Añadir cliente</h3>
<form id="recordForm">
<input type="hidden" id="recordId">
<div id="fields"></div>
<button type="submit" id="saveButton">Guardar</button>
<button type="button" id="cancelEdit" class="secondary hidden">Cancelar edición</button>
</form>
<p id="formMessage" class="muted"></p>
</div>
<div class="panel"><div id="records"></div></div>
</section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyApI8rY6hKHAwPkUqyxswF1eDs5FSuOUOk",
authDomain:"ritmo-d2e26.firebaseapp.com",
projectId:"ritmo-d2e26",
storageBucket:"ritmo-d2e26.firebasestorage.app",
messagingSenderId:"173809621622",
appId:"1:173809621622:web:20c1a5bf209e085bcbdd57"
};

const appFirebase=initializeApp(firebaseConfig);
const auth=getAuth(appFirebase);
const db=getFirestore(appFirebase);
const dataRef=doc(db,"ritmo","shared");
const $=id=>document.getElementById(id);

let data={clients:[],agenda:[],payments:[]};
let tab="clients",stopSync=null,saveTimer=null,editing=null;

const configs={
clients:{title:"Clientes",fields:[
["name","Nombre","text",true],
["phone","Teléfono","tel",false],
["email","Correo","email",false],
["notes","Notas","text",false]]},
agenda:{title:"Agenda",fields:[
["name","Cliente / actividad","text",true],
["date","Fecha","date",true],
["time","Hora","time",false],
["notes","Notas","text",false]]},
payments:{title:"Cobros",fields:[
["name","Cliente / concepto","text",true],
["amount","Importe (€)","number",true],
["date","Fecha","date",false],
["status","Estado","select",true]]}
};

function message(text,cls="muted"){
$("formMessage").className=cls;
$("formMessage").textContent=text;
}

function safe(v){
return String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function showTab(next){
tab=next;
document.querySelectorAll("[data-tab]").forEach(b=>{
b.classList.toggle("active",b.dataset.tab===tab);
b.classList.toggle("secondary",b.dataset.tab!==tab);
});
$("sectionTitle").textContent=configs[tab].title;
renderForm();
renderRecords();
}

function renderForm(){
const c=configs[tab];
$("formTitle").textContent=(editing?"Editar ":"Añadir ")+c.title.toLowerCase();
$("fields").innerHTML="";
c.fields.forEach(([key,label,type,required])=>{
let el;
if(type==="select"){
el=document.createElement("select");
el.innerHTML='<option value="Pendiente">Pendiente</option><option value="Pagado">Pagado</option>';
}else{
el=document.createElement("input");
el.type=type;
el.placeholder=label;
}
el.id="field_"+key;
el.name=key;
el.required=required;
if(type==="number")el.step="0.01";
$("fields").appendChild(el);
});
$("cancelEdit").classList.toggle("hidden",!editing);
}

function renderRecords(){
const list=data[tab]||[];
const out=$("records");
if(!list.length){
out.innerHTML='<div class="empty">Todavía no hay registros.</div>';
return;
}
out.innerHTML=list.slice().sort((a,b)=>(b.created||0)-(a.created||0)).map(item=>{
const c=configs[tab];
let details=c.fields.filter(f=>f[0]!=="name")
.map(f=>item[f[0]]?`${f[1]}: ${item[f[0]]}`:"")
.filter(Boolean).join(" · ");
return `<div class="item">
<strong>${safe(item.name||"Sin nombre")}</strong>
<small>${safe(details||"Sin detalles")}</small>
<div class="actions">
<button class="secondary" data-edit="${safe(item.id)}">Editar</button>
<button class="danger" data-delete="${safe(item.id)}">Eliminar</button>
</div></div>`;
}).join("");
out.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editRecord(b.dataset.edit));
out.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>deleteRecord(b.dataset.delete));
}

function editRecord(id){
const item=data[tab].find(x=>x.id===id);
if(!item)return;
editing=id;
renderForm();
configs[tab].fields.forEach(([key])=>{
const el=$("field_"+key);
if(el)el.value=item[key]??"";
});
window.scrollTo({top:0,behavior:"smooth"});
}

function resetForm(){
editing=null;
$("recordForm").reset();
$("recordId").value="";
renderForm();
}

function scheduleSave(){
$("syncStatus").textContent="Guardando cambios…";
clearTimeout(saveTimer);
saveTimer=setTimeout(async()=>{
try{
await setDoc(dataRef,data);
$("syncStatus").textContent="Sincronizado con la nube";
}catch(e){
$("syncStatus").textContent="No se pudo guardar: "+e.message;
}
},350);
}

$("recordForm").addEventListener("submit",e=>{
e.preventDefault();
const obj={};
configs[tab].fields.forEach(([key])=>{
obj[key]=$("field_"+key)?.value.trim()||"";
});
obj.id=editing||crypto.randomUUID();
obj.created=editing?(data[tab].find(x=>x.id===editing)?.created||Date.now()):Date.now();
if(tab==="payments")obj.amount=Number(obj.amount||0);
if(editing)data[tab]=data[tab].map(x=>x.id===editing?obj:x);
else data[tab].push(obj);
resetForm();
renderRecords();
message("Guardado.");
scheduleSave();
});

$("cancelEdit").onclick=()=>{
resetForm();
message("");
};

async function deleteRecord(id){
if(!confirm("¿Eliminar este registro?"))return;
data[tab]=data[tab].filter(x=>x.id!==id);
renderRecords();
scheduleSave();
}

document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

$("loginForm").addEventListener("submit",async e=>{
e.preventDefault();
$("loginMessage").textContent="Comprobando acceso…";
$("loginButton").disabled=true;
try{
const email=$("email").value.trim().toLowerCase();
if(email!=="veloboaea@gmail.com"){
throw new Error("Esta aplicación solo permite entrar con el correo autorizado.");
}
await signInWithEmailAndPassword(auth,email,$("password").value);
$("loginMessage").textContent="";
}catch(err){
$("loginMessage").textContent=err.code==="auth/invalid-credential"
?"El correo o la contraseña no son correctos."
:err.code==="auth/too-many-requests"
?"Demasiados intentos. Espera un poco e inténtalo de nuevo."
:"No se pudo entrar: "+err.message;
}finally{
$("loginButton").disabled=false;
}
});

$("logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
if(stopSync){stopSync();stopSync=null;}
$("login").classList.toggle("hidden",!!user);
$("app").classList.toggle("hidden",!user);
$("logout").classList.toggle("hidden",!user);
if(!user)return;

if((user.email||"").toLowerCase()!=="veloboaea@gmail.com"){
await signOut(auth);
$("loginMessage").textContent="Este correo no está autorizado para usar Ritmo.";
return;
}

$("syncStatus").textContent="Cargando tus datos…";
try{
const snap=await getDoc(dataRef);
if(!snap.exists()){
let local={};
try{local=JSON.parse(localStorage.getItem("ritmo_data_v1")||"{}");}catch{}
data={
clients:Array.isArray(local.clients)?local.clients:[],
agenda:Array.isArray(local.agenda)?local.agenda:[],
payments:Array.isArray(local.payments)?local.payments:[]
};
await setDoc(dataRef,data);
}else{
const cloud=snap.data();
data={
clients:cloud.clients||[],
agenda:cloud.agenda||[],
payments:cloud.payments||[]
};
}
stopSync=onSnapshot(dataRef,s=>{
if(s.exists()){
const d=s.data();
data={clients:d.clients||[],agenda:d.agenda||[],payments:d.payments||[]};
renderRecords();
$("syncStatus").textContent="Sincronizado con la nube";
}
},err=>{
$("syncStatus").textContent="Error de sincronización: "+err.message;
});
showTab(tab);
}catch(err){
$("syncStatus").textContent="Error al cargar datos: "+err.message;
}
});

$("export").onclick=()=>{
const rows=[["Sección","Nombre","Teléfono","Correo","Fecha","Hora","Importe","Estado","Notas"]];
Object.entries(data).forEach(([section,items])=>
items.forEach(x=>rows.push([
section,x.name||"",x.phone||"",x.email||"",x.date||"",x.time||"",x.amount??"",x.status||"",x.notes||""
])));
const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="ritmo.csv";
a.click();
URL.revokeObjectURL(url);
};

renderForm();
</script>
</body>
</html>
