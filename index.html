
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Ritmo</title>

<style>
:root{
  --orange:#f47721;
  --orange-light:#fff0e5;
  --black:#171717;
  --white:#fff;
  --gray:#777;
  --border:#ececec;
  --bg:#f7f7f7;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--black);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
header{
  background:white;border-bottom:1px solid var(--border);
  padding:18px 16px;position:sticky;top:0;z-index:5
}
.header-inner{
  max-width:900px;margin:auto;display:flex;
  align-items:center;justify-content:space-between;gap:12px
}
.logo{font-size:27px;font-weight:900;letter-spacing:-1px}
.logo span{color:var(--orange)}
button{
  border:0;border-radius:12px;padding:13px 16px;
  font:inherit;font-weight:700;cursor:pointer;
  background:var(--orange);color:white
}
button.secondary{
  background:white;color:var(--black);border:1px solid var(--border)
}
button.dark{background:var(--black);color:white}
button.danger{background:#fff0f0;color:#b42318}
button:disabled{opacity:.6}
main{max-width:900px;margin:auto;padding:18px 15px 50px}
.card{
  background:white;border:1px solid var(--border);
  border-radius:18px;padding:18px;margin-bottom:15px
}
h1,h2,h3{margin-top:0}
h1{font-size:25px}h2{font-size:21px}h3{font-size:17px}
.subtitle{color:var(--gray);margin-top:-8px}
input,select,textarea{
  width:100%;border:1px solid #dedede;background:white;
  color:var(--black);border-radius:11px;padding:13px;
  font:inherit;outline:none
}
input:focus,select:focus,textarea:focus{
  border-color:var(--orange);box-shadow:0 0 0 3px #f477211c
}
textarea{min-height:95px;resize:vertical}
label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.field{margin-bottom:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nav{display:flex;gap:8px;overflow:auto;margin-bottom:15px}
.nav button{white-space:nowrap;flex:1}
.nav button.active{background:var(--orange);color:white}
.nav button:not(.active){background:white;color:#333;border:1px solid var(--border)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row button{width:auto}
.badge{
  display:inline-block;padding:6px 10px;border-radius:30px;
  background:var(--orange-light);color:#b9520d;
  font-size:12px;font-weight:800
}
.client{
  border:1px solid var(--border);border-radius:15px;
  padding:15px;margin-bottom:11px;background:#fff
}
.client-name{font-size:18px;font-weight:800;margin-bottom:5px}
.client-info{font-size:14px;color:#666;line-height:1.6;overflow-wrap:anywhere}
.client-actions{display:flex;gap:8px;margin-top:12px}
.client-actions button{flex:1;padding:10px;font-size:14px}
.empty{text-align:center;padding:25px 10px;color:var(--gray)}
.hidden{display:none!important}
.message{font-size:14px;color:#666;margin-top:10px;white-space:pre-wrap}
.error{color:#b42318}
.orange-line{height:4px;width:45px;background:var(--orange);border-radius:5px;margin:10px 0 17px}
.checkline{display:flex;align-items:center;gap:10px;margin:10px 0}
.checkline input{width:20px;height:20px;accent-color:var(--orange)}
.checkline label{margin:0;font-size:15px}
.section-label{font-size:13px;color:var(--gray);font-weight:800;margin:18px 0 10px}
.related{background:#fffaf6;border:1px solid #ffe1ca;border-radius:13px;padding:13px;margin-bottom:10px}
.related strong{display:block;margin-bottom:5px}
.related small{color:#666;line-height:1.5}
@media(max-width:560px){
 .grid{grid-template-columns:1fr}
 .card{padding:15px}
 .nav button{padding:12px 10px;font-size:14px}
}
</style>
</head>

<body>
<header>
  <div class="header-inner">
    <div class="logo">Rit<span>mo</span></div>
    <button id="logout" class="secondary hidden">Salir</button>
  </div>
</header>

<main>
  <section id="login" class="card">
    <h1>Bienvenido a Ritmo</h1>
    <div class="orange-line"></div>
    <p class="subtitle">Accede a tu espacio de trabajo</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" value="veloboaea@gmail.com" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button id="loginButton" type="submit" style="width:100%">Entrar</button>
      <div id="loginMessage" class="message error"></div>
    </form>
  </section>

  <section id="app" class="hidden">
    <div class="nav">
      <button class="active" data-tab="clients">Clientes</button>
      <button data-tab="agenda">Agenda</button>
      <button data-tab="payments">Cobros</button>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <h1 id="sectionTitle">Clientes</h1>
          <p class="subtitle" id="sectionSubtitle">Gestiona tus clientes y eventos</p>
        </div>
        <span class="badge" id="countBadge">0 clientes</span>
      </div>
      <div class="orange-line"></div>
      <p class="message" id="syncStatus">Conectando…</p>
    </div>

    <div class="card">
      <h2 id="formTitle">Nuevo cliente</h2>
      <form id="recordForm">
        <div id="fields"></div>
        <button type="submit" style="width:100%" id="saveButton">Guardar cliente</button>
        <button type="button" class="secondary hidden" id="cancelEdit" style="width:100%;margin-top:8px">Cancelar edición</button>
      </form>
      <p id="formMessage" class="message"></p>
    </div>

    <div class="card">
      <div class="row">
        <h2 id="listTitle">Mis clientes</h2>
        <button id="export" class="secondary">Exportar</button>
      </div>
      <div id="records"></div>
    </div>
  </section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
 getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
 getFirestore,doc,getDoc,setDoc,onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyApI8rY6hKHAwPkUqyxswF1eDs5FSuOUOk",
 authDomain:"ritmo-d2e26.firebaseapp.com",
 projectId:"ritmo-d2e26",
 storageBucket:"ritmo-d2e26.firebasestorage.app",
 messagingSenderId:"173809621622",
 appId:"1:173809621622:web:20c1a5bf209e085bcbdd57"
};

const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
const db=getFirestore(firebaseApp);
const dataRef=doc(db,"ritmo","shared");
const $=id=>document.getElementById(id);
const AUTHORIZED_EMAIL="veloboaea@gmail.com";

let data={clients:[],agenda:[],payments:[]};
let tab="clients";
let editing=null;
let stopSync=null;
let saveTimer=null;
let saving=false;

const configs={
 clients:{
  title:"Clientes",
  subtitle:"Gestiona tus clientes y eventos",
  singular:"cliente",
  fields:[
   ["name","Nombre del cliente","text",true],
   ["phone","Teléfono","tel",true],
   ["eventType","Tipo de evento","text",true],
   ["location","Ubicación del evento","text",false],
   ["duration","Duración","text",false],
   ["schedule","Horario","text",false],
   ["price","Precio total (€)","number",false],
   ["hasDeposit","¿Ha hecho reserva?","checkbox",false],
   ["deposit","Importe de la reserva (€)","number",false],
   ["depositTo","¿A quién se entregó la reserva?","text",false],
   ["notes","Nota","textarea",false]
  ]
 },
 agenda:{
  title:"Agenda",
  subtitle:"Organiza tus próximas citas y eventos",
  singular:"evento",
  fields:[
   ["clientId","Seleccionar cliente","client",true],
   ["date","Fecha","date",true],
   ["time","Hora","time",false],
   ["location","Ubicación","text",false],
   ["notes","Nota","textarea",false]
  ]
 },
 payments:{
  title:"Cobros",
  subtitle:"Controla los pagos y reservas",
  singular:"cobro",
  fields:[
   ["clientId","Seleccionar cliente","client",true],
   ["amount","Importe (€)","number",true],
   ["date","Fecha","date",false],
   ["status","Estado","select",true],
   ["notes","Nota","textarea",false]
  ]
 }
};

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function clientById(id){
 return data.clients.find(client=>client.id===id);
}

function clientName(id){
 return clientById(id)?.name||"Cliente eliminado o no enlazado";
}

function showMessage(text,cls="message"){
 $("formMessage").className=cls;
 $("formMessage").textContent=text;
}

function showTab(next){
 tab=next;
 editing=null;
 document.querySelectorAll("[data-tab]").forEach(button=>{
  button.classList.toggle("active",button.dataset.tab===tab);
 });
 $("sectionTitle").textContent=configs[tab].title;
 $("sectionSubtitle").textContent=configs[tab].subtitle;
 $("listTitle").textContent=tab==="clients"?"Mis clientes":tab==="agenda"?"Mis eventos":"Mis cobros";
 renderForm();
 renderRecords();
}

function renderForm(){
 const config=configs[tab];
 $("formTitle").textContent=(editing?"Editar ":"Nuevo ")+config.singular;
 $("saveButton").textContent="Guardar "+config.singular;
 $("fields").innerHTML="";

 config.fields.forEach(([key,label,type,required])=>{
  const wrapper=document.createElement("div");
  wrapper.className="field";

  if(type==="client"){
   const lab=document.createElement("label");
   lab.htmlFor="field_"+key;
   lab.textContent=label;

   const input=document.createElement("select");
   input.id="field_"+key;
   input.name=key;
   input.required=required;
   input.innerHTML='<option value="">Elige un cliente…</option>';

   data.clients.forEach(client=>{
    const option=document.createElement("option");
    option.value=client.id;
    option.textContent=client.name||"Cliente sin nombre";
    input.appendChild(option);
   });

   wrapper.append(lab,input);
  }else if(type==="checkbox"){
   wrapper.className="checkline";
   const input=document.createElement("input");
   input.type="checkbox";
   input.id="field_"+key;
   const lab=document.createElement("label");
   lab.htmlFor=input.id;
   lab.textContent=label;
   wrapper.append(input,lab);
  }else{
   const lab=document.createElement("label");
   lab.htmlFor="field_"+key;
   lab.textContent=label;
   let input;

   if(type==="textarea"){
    input=document.createElement("textarea");
    input.placeholder="Escribe aquí…";
   }else if(type==="select"){
    input=document.createElement("select");
    input.innerHTML='<option value="Pendiente">Pendiente</option><option value="Pagado">Pagado</option>';
   }else{
    input=document.createElement("input");
    input.type=type;
    input.placeholder=label;
   }

   input.id="field_"+key;
   input.name=key;
   input.required=required;
   if(type==="number")input.step="0.01";
   wrapper.append(lab,input);
  }

  $("fields").appendChild(wrapper);
 });

 $("cancelEdit").classList.toggle("hidden",!editing);
}

function relatedToClient(clientId){
 const events=data.agenda.filter(item=>item.clientId===clientId);
 const payments=data.payments.filter(item=>item.clientId===clientId);
 return {events,payments};
}

function renderClientRelated(clientId){
 const {events,payments}=relatedToClient(clientId);
 let html="";

 if(events.length){
  html+='<div class="section-label">AGENDA · '+events.length+'</div>';
  html+=events.map(item=>`
   <div class="related">
    <strong>${escapeHTML(item.date||"Evento")}${item.time?" · "+escapeHTML(item.time):""}</strong>
    <small>${escapeHTML(item.location||"")}${item.notes?" · "+escapeHTML(item.notes):""}</small>
   </div>`).join("");
 }

 if(payments.length){
  html+='<div class="section-label">COBROS · '+payments.length+'</div>';
  html+=payments.map(item=>`
   <div class="related">
    <strong>${escapeHTML(item.amount??0)} € · ${escapeHTML(item.status||"Pendiente")}</strong>
    <small>${escapeHTML(item.date||"")}${item.notes?" · "+escapeHTML(item.notes):""}</small>
   </div>`).join("");
 }

 if(!events.length&&!payments.length){
  html='<div class="client-info">Todavía no tiene eventos ni cobros enlazados.</div>';
 }

 return html;
}

function renderRecords(){
 const list=data[tab]||[];
 $("countBadge").textContent=list.length+" "+(tab==="clients"?"clientes":tab==="agenda"?"eventos":"cobros");
 const out=$("records");

 if(!list.length){
  out.innerHTML='<div class="empty">Todavía no hay registros.<br>Añade el primero arriba.</div>';
  return;
 }

 out.innerHTML=list.slice().sort((a,b)=>(b.created||0)-(a.created||0)).map(item=>{
  let details=[];

  if(tab==="clients"){
   if(item.phone)details.push("Tel: "+item.phone);
   if(item.eventType)details.push("Evento: "+item.eventType);
   if(item.location)details.push("Ubicación: "+item.location);
   if(item.duration)details.push("Duración: "+item.duration);
   if(item.schedule)details.push("Horario: "+item.schedule);
   if(item.price!==""&&item.price!=null)details.push("Precio: "+item.price+" €");
   if(item.hasDeposit)details.push("Reserva: "+(item.deposit||0)+" €"+(item.depositTo?" · "+item.depositTo:""));
   if(item.notes)details.push("Nota: "+item.notes);
  }else if(tab==="agenda"){
   details.push("Cliente: "+clientName(item.clientId));
   if(item.date)details.push("Fecha: "+item.date);
   if(item.time)details.push("Hora: "+item.time);
   if(item.location)details.push("Ubicación: "+item.location);
   if(item.notes)details.push("Nota: "+item.notes);
  }else{
   details.push("Cliente: "+clientName(item.clientId));
   if(item.amount!==""&&item.amount!=null)details.push("Importe: "+item.amount+" €");
   if(item.date)details.push("Fecha: "+item.date);
   if(item.status)details.push("Estado: "+item.status);
   if(item.notes)details.push("Nota: "+item.notes);
  }

  const related=tab==="clients"?renderClientRelated(item.id):"";

  return `<div class="client">
   <div class="client-name">${escapeHTML(item.name||"Sin nombre")}</div>
   <div class="client-info">${details.map(escapeHTML).join("<br>")}</div>
   ${related}
   <div class="client-actions">
    <button class="secondary" data-edit="${escapeHTML(item.id)}">Editar</button>
    <button class="danger" data-delete="${escapeHTML(item.id)}">Eliminar</button>
   </div>
  </div>`;
 }).join("");

 out.querySelectorAll("[data-edit]").forEach(button=>{
  button.onclick=()=>editRecord(button.dataset.edit);
 });
 out.querySelectorAll("[data-delete]").forEach(button=>{
  button.onclick=()=>deleteRecord(button.dataset.delete);
 });
}

function editRecord(id){
 const item=data[tab].find(record=>record.id===id);
 if(!item)return;

 editing=id;
 renderForm();

 configs[tab].fields.forEach(([key,,type])=>{
  const field=$("field_"+key);
  if(!field)return;
  if(type==="checkbox")field.checked=!!item[key];
  else if(type==="client")field.value=item.clientId||"";
  else field.value=item[key]??"";
 });

 $("formTitle").textContent="Editar "+configs[tab].singular;
 $("cancelEdit").classList.remove("hidden");
 window.scrollTo({top:0,behavior:"smooth"});
}

function resetForm(){
 editing=null;
 $("recordForm").reset();
 renderForm();
}

function scheduleSave(){
 $("syncStatus").textContent="Guardando cambios…";
 clearTimeout(saveTimer);
 saveTimer=setTimeout(async()=>{
  if(saving)return;
  saving=true;
  try{
   await setDoc(dataRef,data);
   $("syncStatus").textContent="Datos sincronizados";
  }catch(error){
   $("syncStatus").textContent="Error al guardar: "+error.message;
  }finally{
   saving=false;
  }
 },400);
}

$("recordForm").addEventListener("submit",event=>{
 event.preventDefault();
 const record={};

 configs[tab].fields.forEach(([key,,type])=>{
  const field=$("field_"+key);
  if(!field)return;

  if(type==="checkbox")record[key]=field.checked;
  else if(type==="client")record[key]=field.value;
  else record[key]=field.value.trim();
 });

 record.id=editing||crypto.randomUUID();
 const previous=data[tab].find(item=>item.id===editing);
 record.created=previous?.created||Date.now();

 if(tab==="clients"){
  record.price=record.price===""?"":Number(record.price);
  record.deposit=record.deposit===""?"":Number(record.deposit);
 }else{
  const selected=clientById(record.clientId);
  if(!selected){
   showMessage("Selecciona un cliente para continuar.","message error");
   return;
  }
  record.clientName=selected.name||"";
  record.name=record.clientName;
  if(tab==="payments")record.amount=Number(record.amount||0);
 }

 if(editing){
  data[tab]=data[tab].map(item=>item.id===editing?record:item);
 }else{
  data[tab].push(record);
 }

 resetForm();
 renderRecords();
 showMessage("Guardado correctamente.");
 scheduleSave();
});

$("cancelEdit").onclick=()=>{
 resetForm();
 showMessage("");
};

async function deleteRecord(id){
 const item=data[tab].find(record=>record.id===id);
 if(!item)return;

 let question="¿Quieres eliminar este registro?";
 if(tab==="clients"){
  const related=relatedToClient(id);
  if(related.events.length||related.payments.length){
   question="Este cliente tiene eventos o cobros enlazados. Si lo eliminas, esos registros permanecerán, pero perderán el enlace al cliente. ¿Continuar?";
  }
 }
 if(!confirm(question))return;

 data[tab]=data[tab].filter(record=>record.id!==id);
 renderRecords();
 scheduleSave();
}

document.querySelectorAll("[data-tab]").forEach(button=>{
 button.addEventListener("click",()=>showTab(button.dataset.tab));
});

$("loginForm").addEventListener("submit",async event=>{
 event.preventDefault();
 $("loginMessage").textContent="Comprobando acceso…";
 $("loginButton").disabled=true;

 try{
  const email=$("email").value.trim().toLowerCase();
  if(email!==AUTHORIZED_EMAIL){
   throw new Error("Este correo no está autorizado para entrar en Ritmo.");
  }
  await signInWithEmailAndPassword(auth,email,$("password").value);
  $("loginMessage").textContent="";
 }catch(error){
  $("loginMessage").textContent=
   error.code==="auth/invalid-credential"
   ?"El correo o la contraseña no son correctos."
   :error.code==="auth/too-many-requests"
   ?"Demasiados intentos. Espera un poco y vuelve a intentarlo."
   :error.message;
 }finally{
  $("loginButton").disabled=false;
 }
});

$("logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
 if(stopSync){stopSync();stopSync=null;}

 $("login").classList.toggle("hidden",!!user);
 $("app").classList.toggle("hidden",!user);
 $("logout").classList.toggle("hidden",!user);

 if(!user)return;

 if((user.email||"").toLowerCase()!==AUTHORIZED_EMAIL){
  await signOut(auth);
  $("loginMessage").textContent="Este correo no está autorizado.";
  return;
 }

 $("syncStatus").textContent="Cargando tus datos…";

 try{
  const snapshot=await getDoc(dataRef);

  if(!snapshot.exists()){
   let oldData={};
   try{
    oldData=JSON.parse(localStorage.getItem("ritmo_data_v1")||"{}");
   }catch{}

   data={
    clients:Array.isArray(oldData.clients)?oldData.clients:[],
    agenda:Array.isArray(oldData.agenda)?oldData.agenda:[],
    payments:Array.isArray(oldData.payments)?oldData.payments:[]
   };
   await setDoc(dataRef,data);
  }else{
   const cloud=snapshot.data();
   data={
    clients:cloud.clients||[],
    agenda:cloud.agenda||[],
    payments:cloud.payments||[]
   };
  }

  stopSync=onSnapshot(dataRef,snapshot=>{
   if(snapshot.exists()){
    const cloud=snapshot.data();
    data={
     clients:cloud.clients||[],
     agenda:cloud.agenda||[],
     payments:cloud.payments||[]
    };
    renderForm();
    renderRecords();
    $("syncStatus").textContent="Datos sincronizados";
   }
  },error=>{
   $("syncStatus").textContent="Error de sincronización: "+error.message;
  });

  showTab(tab);
 }catch(error){
  $("syncStatus").textContent="No se pudieron cargar los datos: "+error.message;
 }
});

$("export").onclick=()=>{
 const rows=[[
  "Sección","Cliente","Teléfono","Tipo de evento","Ubicación",
  "Duración","Horario","Precio","Reserva","Importe reserva",
  "Reserva entregada a","Fecha","Hora","Importe cobro","Estado","Nota"
 ]];

 data.clients.forEach(item=>{
  rows.push([
   "Cliente",item.name||"",item.phone||"",item.eventType||"",
   item.location||"",item.duration||"",item.schedule||"",
   item.price??"",item.hasDeposit?"Sí":"No",item.deposit??"",
   item.depositTo||"","","","","",item.notes||""
  ]);
 });

 data.agenda.forEach(item=>{
  const client=clientById(item.clientId);
  rows.push([
   "Agenda",client?.name||item.clientName||"",client?.phone||"",
   client?.eventType||"",item.location||client?.location||"",
   client?.duration||"",client?.schedule||"",client?.price??"",
   client?.hasDeposit?"Sí":"No",client?.deposit??"",
   client?.depositTo||"",item.date||"",item.time||"",
   "","",item.notes||""
  ]);
 });

 data.payments.forEach(item=>{
  const client=clientById(item.clientId);
  rows.push([
   "Cobro",client?.name||item.clientName||"",client?.phone||"",
   client?.eventType||"",client?.location||"",client?.duration||"",
   client?.schedule||"",client?.price??"",client?.hasDeposit?"Sí":"No",
   client?.deposit??"",client?.depositTo||"",item.date||"",
   "",item.amount??"",item.status||"",item.notes||""
  ]);
 });

 const csv=rows.map(row=>row.map(value=>
  '"'+String(value??"").replace(/"/g,'""')+'"'
 ).join(",")).join("\r\n");

 const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const link=document.createElement("a");
 link.href=url;
